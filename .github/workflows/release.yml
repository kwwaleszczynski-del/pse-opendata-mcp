# Builds and checks the distributions for every published GitHub release. Uploading to PyPI with Trusted Publishing
# (OIDC, no API token in the repository) is switched off until the repository variable PYPI_PUBLISH is set to
# "true" (see "Releasing" in README.md). A manual run (workflow_dispatch) only builds and checks.
name: release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Console script from the built wheel in a fresh environment
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/pse-opendata-mcp --version | tee /tmp/version.txt
      - name: Release tag, package version and server.json agree
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test "$(cat /tmp/version.txt)" = "pse-opendata-mcp $tag"
          grep -q "\"version\": \"$tag\"" server.json
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: ${{ vars.PYPI_PUBLISH == 'true' && github.event_name == 'release' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pse-opendata-mcp/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
